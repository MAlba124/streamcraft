[package]
name = "sc-http"
description = "Hand-written, dependency-free HTTP/1.1 source plugin for streamcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sc_http"

[dependencies]
# std-only networking — no HTTP/networking crate. Kept a separate plugin so the
# eventual TLS dependency (for https) never leaks into the framework crates.
streamcraft-core = { path = "../core" }

[dev-dependencies]
streamcraft-elements = { path = "../elements" }

[features]
default = []
# Test-only: run the download integration tests against the hand-rolled io_uring
# reactor (elements' `io-uring`), exercising the streaming `Recv` op (offset -1) on a
# real socket fd. The library itself has no io_uring code — the reactor is injected.
io-uring = ["streamcraft-elements/io-uring"]
