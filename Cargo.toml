[workspace]
resolver = "2"
exclude = [
    # Vendored oxideav-h264 0.1.7 + the RefPicStore eviction fix (see
    # vendor/oxideav-h264/STREAMCRAFT-PATCHES.md); wired via [patch.crates-io].
    "vendor/oxideav-h264",
    "vendor/oxideav-aac",
    "vendor/oxideav-vp8",
]
members = [
    "core",
    "elements",
    "http",
    "aac",
    "flac",
    "ogg",
    "mkv",
    "audio",
    "video",
    "vp8",
    "h264",
    "h265",
    "av1",
    "vp9",
    "scope",
    "pipewire",
    "opus",
    "mp3",
    "mp4",
    "sdl3",
    "vaapi",
    "rtp",
    "rtsp",
    "launch",
    "nvr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MAlba124/streamcraft"

[profile.release]
# Thin LTO: the adopted decoders (oxideav-*) are allocation- and call-heavy;
# cross-crate inlining buys real throughput on the playback path.
lto = "thin"
# Enough DWARF for profilers to symbolize release captures (heaptrack, perf,
# simprof): function names + line tables, without the full-variable debuginfo
# that balloons build time and binary size. Runtime cost: none.
debug = "line-tables-only"

[profile.bench]
debug = true

[patch.crates-io]
# Upstream 0.1.7 leaks every reference picture: RefPicStore has insert() and no
# eviction, so playback grows ~35 MB/s until OOM. Vendored with a minimal
# retain_keys sweep (documented in vendor/oxideav-h264/STREAMCRAFT-PATCHES.md,
# to be offered upstream).
oxideav-h264 = { path = "vendor/oxideav-h264" }
# Upstream 0.1.6 computes the IMDCT as a naive O(N²) sum with a libm cos()
# per term (~40% of a playback process's CPU; audio couldn't hold realtime).
# Vendored with a Chebyshev-recurrence patch (STREAMCRAFT-PATCHES.md).
oxideav-aac = { path = "vendor/oxideav-aac" }
# Upstream 0.2.6's bool decoder errors instead of feeding the implicit zero
# bytes real encoders' partition tails rely on (libvpx bool_decoder_fill
# semantics) — ~30% of Intel-iHD-encoded frames failed at the last macroblock.
# Vendored with a bounded virtual-zero-padding patch (STREAMCRAFT-PATCHES.md).
oxideav-vp8 = { path = "vendor/oxideav-vp8" }
