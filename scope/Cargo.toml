[package]
name = "streamcraft-scope"
description = "Slint inspector GUI + MCP server over the core introspection protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "streamcraft_scope"

[[bin]]
name = "scraft-scope"
path = "src/main.rs"

[dependencies]
streamcraft-core = { path = "../core", features = ["introspect"] }
