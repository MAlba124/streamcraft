[package]
name = "sc-vk"
description = "Clean-room Vulkan video renderer for streamcraft — renders into exported DMA-BUFs presented by sc-wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sc_vk"

[dependencies]
streamcraft-core = { path = "../core" }
streamcraft-video = { path = "../video" }
sc-wayland = { path = "../wayland" }
# The one sanctioned dependency: pure Vulkan API bindings (no logic, loads
# libvulkan at runtime). The renderer itself is clean-room per the project's
# algorithm-citation rule.
ash = { version = "0.38", default-features = false, features = ["loaded"] }

[dev-dependencies]
streamcraft-elements = { path = "../elements" }
