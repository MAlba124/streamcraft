[package]
name = "sc-mpeg4p2"
description = "Pure-Rust MPEG-4 Part 2 (Visual) Advanced Simple Profile decoder plugin for streamcraft (the XviD/DivX codec)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sc_mpeg4p2"

[dependencies]
# Unlike sc-vp8 / sc-h264 this codec is HAND-WRITTEN, clean-room from ISO/IEC
# 14496-2 — no backing library, no FFI, no libav. The decode core is pure Rust
# with only streamcraft-core (the element trait + buffer/pool) and
# streamcraft-video (colorimetry passthrough) as deps.
streamcraft-core = { path = "../core" }
streamcraft-video = { path = "../video" }

[dev-dependencies]
streamcraft-elements = { path = "../elements" }
