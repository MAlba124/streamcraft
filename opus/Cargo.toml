[package]
name = "pf-opus"
description = "Opus (RFC 6716) codec plugin for profluens, backed by the pure-Rust oxideav-opus (git master — the working decoder+encoder the published 0.0.13 scaffold lacks)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pf_opus"

[dependencies]
profluens-core = { path = "../core" }
# Pure-Rust Opus, the one sanctioned kind of plugin dependency (like oxideav-mp3 for
# pf-mp3): no build.rs, no unsafe, MIT, RFC 6716/7845-annotated. The *published* 0.0.13
# is an "orphan-rebuild scaffold" that decodes real Opus to silence/noise (see src/lib.rs
# history), so we vendor git master — the working clean-room decoder + encoder — with a
# minimal `decode_packet_into` no-alloc patch (vendor/oxideav-opus/PROFLUENS-PATCHES.md).
# Its only dependency is oxideav-core (no serde_json, unlike the other OxideAV crates).
oxideav-opus = { path = "../vendor/oxideav-opus" }

[dev-dependencies]
# Conformance gate: decode RFC 6716 test vectors and cross-check an ffmpeg/libopus oracle.
profluens-elements = { path = "../elements" }
