[package]
name = "pf-flac"
description = "Hand-written, dependency-free FLAC (RFC 9639) codec plugin for profluens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pf_flac"

[dependencies]
# Hand-written codec — the whole point is zero codec/DSP dependencies. Only the
# framework's core vocabulary (buffers, batches, the element contract) is pulled in.
profluens-core = { path = "../core" }

[dev-dependencies]
# Only for the end-to-end element test (filesrc ! flacenc ! filesink); the library
# itself depends on core alone.
profluens-elements = { path = "../elements" }
# Only for the FLAC-in-Ogg de-framer round-trip test (oggmux ! oggdemux ! oggflacdeframe
# ! flacdec). No dependency cycle: pf-ogg does not depend on pf-flac (the container is
# codec-agnostic), so flac depending on ogg for tests is one-directional.
pf-ogg = { path = "../ogg" }
